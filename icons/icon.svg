<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#182438"/>
      <stop offset="70%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Stadium Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#263554" stroke-width="6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="14 10" opacity="0.8"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#neonPink)" stroke-width="3" opacity="0.6"/>

  <!-- Rotating Beyblade Blade 1 (Top-Right) -->
  <path d="M 256 96 C 330 96, 390 140, 410 200 C 370 215, 330 205, 290 220 C 300 170, 280 130, 256 96 Z" fill="url(#neonCyan)" filter="url(#neonGlow)"/>

  <!-- Rotating Beyblade Blade 2 (Bottom-Right) -->
  <path d="M 416 256 C 416 330, 372 390, 312 410 C 297 370, 307 330, 292 290 C 342 300, 382 280, 416 256 Z" fill="url(#neonPink)" filter="url(#neonGlow)"/>

  <!-- Rotating Beyblade Blade 3 (Bottom-Left) -->
  <path d="M 256 416 C 182 416, 122 372, 102 312 C 142 297, 182 307, 222 292 C 212 342, 232 382, 256 416 Z" fill="url(#neonCyan)" filter="url(#neonGlow)"/>

  <!-- Rotating Beyblade Blade 4 (Top-Left) -->
  <path d="M 96 256 C 96 182, 140 122, 200 102 C 215 142, 205 182, 220 222 C 170 212, 130 232, 96 256 Z" fill="url(#neonPink)" filter="url(#neonGlow)"/>

  <!-- Center Core Stadium Hub -->
  <circle cx="256" cy="256" r="85" fill="#090d16" stroke="url(#neonGold)" stroke-width="6" filter="url(#neonGlow)"/>

  <!-- Iconic 'X' in Center -->
  <path d="M 215 195 L 256 242 L 297 195 L 322 210 L 275 256 L 322 302 L 297 317 L 256 270 L 215 317 L 190 302 L 237 256 L 190 210 Z" fill="url(#neonGold)" filter="url(#neonGlow)"/>
  
  <!-- Tiny center spark -->
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
</svg>
