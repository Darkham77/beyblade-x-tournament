    function doDownload() {
      const byteChars = atob(b64Data);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) {
        byteNumbers[i] = byteChars.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      document.getElementById('btn-download').innerText = '✅ ¡Descargado!';
      document.getElementById('btn-download').style.background = '#38a169';
    }
    // Auto-trigger on mobile
    window.addEventListener('load', () => {
      setTimeout(doDownload, 500);
    });
